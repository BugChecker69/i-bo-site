<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | I-BO OFFICE</title>
  <meta name="description" content="I-BO OFFICE のブログ・活動記録一覧です。">
  <meta name="robots" content="noindex, nofollow">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased flex flex-col min-h-screen">

  <!-- ヘッダー / ナビゲーション -->
  <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="../provisional.html" class="flex items-center">
        <img src="../images/IBOF_logo_128.png" alt="I-BO OFFICE" class="h-9 w-auto">
      </a>
      <nav class="hidden md:flex space-x-6 text-sm font-medium">
        <a href="../provisional.html#services" class="hover:text-cyan-400 transition">Services</a>
        <a href="../provisional.html#about" class="hover:text-cyan-400 transition">About</a>
        <a href="index.html" class="text-cyan-400 font-semibold transition">Blog</a>
        <a href="../provisional.html#contact" class="hover:text-cyan-400 transition">Contact</a>
      </nav>
      <a href="../provisional.html#contact" class="text-xs md:text-sm bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded font-medium transition">
        お問い合わせ
      </a>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-grow max-w-5xl mx-auto px-4 py-16 w-full">
    
    <!-- ページタイトル -->
    <div class="mb-12 border-b border-slate-800 pb-8">
      <span class="text-xs uppercase tracking-widest text-cyan-400 font-semibold mb-2 inline-block">Official Blog</span>
      <h1 class="text-3xl md:text-4xl font-extrabold text-white">記事一覧</h1>
      <p class="text-slate-400 text-sm mt-2">ITサポート、業務自動化、ドローン空撮の現場検証やプロジェクトの活動記録を発信します。</p>
    </div>

    <!-- 記事一覧コンテナ（JavaScriptで動的描画） -->
    <div id="posts-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div id="loading" class="col-span-full py-12 text-center text-slate-500 text-sm">
        記事を読み込み中...
      </div>
    </div>

    <!-- ページ送りナビゲーション -->
    <div id="pagination" class="mt-12 flex justify-center items-center gap-2"></div>

  </main>

  <!-- フッター -->
  <footer class="border-t border-slate-800 py-8 text-center text-xs text-slate-400">
    <p>&copy; 2026-2027 I-BO OFFICE. All rights reserved.</p>
  </footer>

  <!-- 記事一覧取得・ページネーション制御スクリプト -->
  <script>
    (async function initBlog() {
      const container = document.getElementById('posts-container');
      const paginationContainer = document.getElementById('pagination');
      const loading = document.getElementById('loading');

      const POSTS_PER_PAGE = 10;
      let allPosts = [];
      let currentPage = 1;

      try {
        const response = await fetch(`posts.json?t=${new Date().getTime()}`);
        if (!response.ok) throw new Error('posts.json の取得に失敗しました');

        allPosts = await response.json();
        if (loading) loading.remove();

        if (!allPosts || allPosts.length === 0) {
          container.innerHTML = `
            <div class="col-span-full py-12 text-center text-slate-400 text-sm">
              公開中の記事はまだありません。
            </div>
          `;
          return;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const pageFromUrl = parseInt(urlParams.get('page'), 10);
        if (!isNaN(pageFromUrl) && pageFromUrl > 0) {
          const totalPages = Math.ceil(allPosts.length / POSTS_PER_PAGE);
          if (pageFromUrl <= totalPages) {
            currentPage = pageFromUrl;
          }
        }

        renderPage(currentPage);

      } catch (error) {
        if (loading) loading.remove();
        container.innerHTML = `
          <div class="col-span-full py-12 text-center text-rose-400 text-sm">
            記事一覧の取得に失敗しました。
          </div>
        `;
        console.error(error);
      }

      function renderCards(posts) {
        container.innerHTML = posts.map(post => `
          <a href="${post.url}" class="block bg-slate-800/60 hover:bg-slate-800/90 border border-slate-700/80 hover:border-cyan-500/50 rounded-lg p-6 transition duration-200 group focus:outline-none focus:ring-2 focus:ring-cyan-500">
            <article class="flex flex-col justify-between h-full">
              <div>
                <div class="flex items-center gap-3 mb-3 text-xs">
                  <span class="text-slate-400 font-mono">${post.date || ''}</span>
                  <span class="bg-slate-700/60 text-cyan-400 px-2.5 py-0.5 rounded font-medium">${post.category || 'その他'}</span>
                </div>
                <h2 class="text-lg font-bold text-white mb-3 group-hover:text-cyan-400 transition leading-snug">
                  ${post.title}
                </h2>
                <p class="text-slate-400 text-sm leading-relaxed mb-6">
                  ${post.summary || ''}
                </p>
              </div>
              <div class="text-xs font-semibold text-cyan-400 inline-flex items-center gap-1 group-hover:text-cyan-300">
                <span>記事を読む</span>
                <svg class="w-3.5 h-3.5 transition transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
              </div>
            </article>
          </a>
        `).join('');
      }

      function renderPagination(total, current) {
        if (total <= 1) {
          paginationContainer.innerHTML = '';
          return;
        }

        let html = '';

        if (current > 1) {
          html += `
            <button onclick="changePage(${current - 1})" class="px-3 py-1.5 rounded text-xs font-medium border border-slate-700 text-slate-300 hover:bg-slate-800 hover:text-white transition">
              前へ
            </button>
          `;
        }

        for (let i = 1; i <= total; i++) {
          if (i === current) {
            html += `
              <span class="px-3 py-1.5 rounded text-xs font-bold bg-cyan-600 text-white border border-cyan-500 font-mono">
                ${i}
              </span>
            `;
          } else {
            html += `
              <button onclick="changePage(${i})" class="px-3 py-1.5 rounded text-xs font-medium border border-slate-700 text-slate-400 hover:bg-slate-800 hover:text-white transition font-mono">
                ${i}
              </button>
            `;
          }
        }

        if (current < total) {
          html += `
            <button onclick="changePage(${current + 1})" class="px-3 py-1.5 rounded text-xs font-medium border border-slate-700 text-slate-300 hover:bg-slate-800 hover:text-white transition">
              次へ
            </button>
          `;
        }

        paginationContainer.innerHTML = html;
      }

      function renderPage(page) {
        currentPage = page;
        const totalPages = Math.ceil(allPosts.length / POSTS_PER_PAGE);

        const start = (page - 1) * POSTS_PER_PAGE;
        const end = start + POSTS_PER_PAGE;
        const currentPosts = allPosts.slice(start, end);

        renderCards(currentPosts);
        renderPagination(totalPages, page);

        const newUrl = page === 1 ? window.location.pathname : `?page=${page}`;
        window.history.replaceState({ page }, '', newUrl);

        window.scrollTo({ top: container.offsetTop - 100, behavior: 'smooth' });
      }

      window.changePage = renderPage;
    })();
  </script>

</body>
</html>
