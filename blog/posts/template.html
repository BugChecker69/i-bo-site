  <!-- メインコンテンツ -->

    <header class="mb-10 pb-8 border-b border-slate-800">
      <div class="flex items-center gap-3 mb-4 text-xs">
        <time datetime="YYYY-MM-DD" class="text-slate-400 font-mono">YYYY.MM.DD</time>
        <span class="bg-cyan-950 text-cyan-400 border border-cyan-800/50 px-2.5 py-0.5 rounded font-medium">カテゴリ名</span>
      </div>
      <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold text-white leading-tight mb-4">
        【記事タイトルを入力】
      </h1>
      <p class="text-slate-400 text-sm md:text-base leading-relaxed">
        【記事のリード文・導入要約を入力】
      </p>
    </header>

    <!-- 記事本文 -->
    <article class="space-y-8 text-slate-300 text-sm sm:text-base leading-relaxed">
      
      <!-- セクション 1 -->
      <section>
        <h2 class="text-xl sm:text-2xl font-bold text-white mb-4 flex items-center gap-2 border-l-4 border-cyan-500 pl-3">
          大見出し（H2）
        </h2>
        <p class="mb-4">
          ここに本文を入力します。必要に応じて文章を展開してください。インラインコードは <code class="bg-slate-800 text-cyan-300 px-1.5 py-0.5 rounded font-mono text-sm">sample code</code> のように表現できます。
        </p>
      </section>

      <!-- セクション 2（中見出し・リストを含む構成） -->
      <section>
        <h2 class="text-xl sm:text-2xl font-bold text-white mb-4 flex items-center gap-2 border-l-4 border-cyan-500 pl-3">
          大見出し（H2）
        </h2>
        <h3 class="text-lg font-bold text-slate-200 mb-3">
          中見出し（H3）
        </h3>
        <p class="mb-4">
          箇条書きリストの配置例です。
        </p>
        <ul class="list-disc list-inside space-y-2 text-slate-400 pl-2 mb-6">
          <li>リスト項目 1</li>
          <li>リスト項目 2</li>
          <li>リスト項目 3</li>
        </ul>

        <!-- ハイライト・カード枠 -->
        <div class="bg-slate-800/60 border border-slate-700/80 rounded-lg p-5 my-4">
          <h4 class="text-base font-bold text-white mb-2">ポイント・補足カード</h4>
          <p class="text-slate-400 text-sm">
            注目させたい補足情報や重要事項をここに記述します。
          </p>
        </div>
      </section>

    </article>
