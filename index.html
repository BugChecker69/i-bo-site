<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>i-bo.jp | 「楽しい」を見つけ共有する</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@600;900&family=Noto+Sans+JP:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(18, 22, 36, 0.7);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-purple: #7928ca;
      --text-main: #e2e8f0;
      --text-sub: #94a3b8;
      --border-glow: rgba(0, 242, 254, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'JetBrains Mono', 'Noto Sans JP', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: 24px;
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 242, 254, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 242, 254, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
      -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
    }

    .glow-sphere {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, var(--accent-purple) 0%, rgba(79, 172, 254, 0.2) 50%, transparent 70%);
      filter: blur(80px);
      opacity: 0.5;
      pointer-events: none;
      animation: float 10s ease-in-out infinite alternate;
    }

    @keyframes float {
      0% { transform: translate(-30%, -20%) scale(1); }
      100% { transform: translate(30%, 20%) scale(1.15); }
    }

    .container {
      position: relative;
      z-index: 10;
      max-width: 640px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glow);
      border-radius: 16px;
      padding: 48px 36px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 242, 254, 0.1);
      text-align: center;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 242, 254, 0.08);
      border: 1px solid rgba(0, 242, 254, 0.3);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-cyan);
      margin-bottom: 24px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--accent-cyan);
      box-shadow: 0 0 8px var(--accent-cyan);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    h1.domain-title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.4rem, 6vw, 3.6rem);
      font-weight: 900;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent-cyan) 80%, var(--accent-blue) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      line-height: 1.1;
    }

    .tagline {
      font-size: 1.05rem;
      color: var(--text-sub);
      font-weight: 500;
      margin-bottom: 36px;
      letter-spacing: 0.08em;
    }

    .console-box {
      background: rgba(8, 10, 16, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 16px 20px;
      text-align: left;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 36px;
      line-height: 1.6;
    }

    .console-line {
      display: flex;
      gap: 10px;
    }

    .console-line span.prompt {
      color: var(--accent-cyan);
      user-select: none;
    }

    .console-line span.active {
      color: #38bdf8;
    }

    .progress-wrapper {
      margin-top: 10px;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar {
      width: 68%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan));
      box-shadow: 0 0 10px var(--accent-cyan);
      border-radius: 2px;
    }

    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent-cyan);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 10px 20px;
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 8px;
      transition: all 0.25s ease;
      background: rgba(0, 242, 254, 0.03);
    }

    .contact-link:hover {
      background: rgba(0, 242, 254, 0.12);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
      transform: translateY(-2px);
    }

    footer {
      margin-top: 36px;
      font-size: 0.72rem;
      color: #475569;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="grid-overlay"></div>
  <div class="glow-sphere"></div>

  <main class="container">
    <div class="status-badge">
      <span class="status-dot"></span>
      System Deployment in Progress
    </div>

    <h1 class="domain-title">i-bo.jp</h1>
    <p class="tagline">「楽しい」を見つけ共有する</p>

    <div class="console-box">
      <div class="console-line">
        <span class="prompt">&gt;</span>
        <span>STATUS: Initializing platform architecture...</span>
      </div>
      <div class="console-line">
        <span class="prompt">&gt;</span>
        <span class="active">SYSTEM: Online [DNS / Routing / SSL Validated]</span>
      </div>
      <div class="progress-wrapper">
        <div class="progress-bar"></div>
      </div>
    </div>

    <div>
      <a href="mailto:info@i-bo.jp" class="contact-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="16" x="2" y="4" rx="2"></rect>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
        </svg>
        Contact: info@i-bo.jp
      </a>
    </div>

    <footer>
      &copy; 2026 i-bo.jp. All rights reserved.
    </footer>
