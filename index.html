<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I-BO OFFICE | 「楽しい」を見つけ共有する</title>
  <meta name="description" content="I-BO OFFICE 公式サイト（準備中）">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- ヘッダー -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="#" class="flex items-center">
        <img src="images/IBOF_logo_128.png" alt="I-BO OFFICE" class="h-9 w-auto">
      </a>
      <span class="text-xs font-semibold px-2.5 py-1 rounded bg-slate-800 text-cyan-400 border border-slate-700 font-mono">
        LAUNCHING 2027.04
      </span>
    </div>
  </header>

  <!-- メイン（工事中・ティザー） -->
  <main class="flex-grow flex items-center justify-center px-4 py-16 text-center">
    <div class="max-w-2xl mx-auto">
      
      <div class="inline-flex items-center gap-2 bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs px-3 py-1 rounded-full font-medium mb-6">
        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
        UNDER CONSTRUCTION
      </div>

      <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight text-white mb-6 leading-tight">
        「楽しい」を見つけ共有する
      </h1>

      <p class="text-slate-400 text-sm sm:text-base leading-relaxed mb-8 max-w-xl mx-auto">
        ITサポート / 業務自動化支援 / ドローン空撮<br>
        ただいま2027年4月の正式オープンに向けてWebサイトを準備中です。
      </p>

      <div class="bg-slate-800/40 border border-slate-800 p-6 sm:p-8 rounded-2xl max-w-lg mx-auto text-left shadow-xl">
        <p class="text-slate-400 text-sm mb-6 text-center">
          事前のご相談やお仕事のご依頼は下記より承っております。
        </p>

        <form id="teaser-contact-form" class="space-y-4">
          <!-- スパム対策用ハニーポット -->
          <div style="position: absolute; left: -9999px; top: -9999px; height: 0; width: 0; overflow: hidden;" aria-hidden="true">
            <input type="text" name="hp_field" tabindex="-1" autocomplete="off">
          </div>

          <div>
            <label for="name" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">お名前 <span class="text-cyan-400">*</span></label>
            <input type="text" id="name" name="name" required placeholder="山田 太郎"
              class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 placeholder-slate-500 text-sm focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition">
          </div>

          <div>
            <label for="email" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">メールアドレス <span class="text-cyan-400">*</span></label>
            <input type="email" id="email" name="email" required placeholder="your-email@example.com"
              class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 placeholder-slate-500 text-sm focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition font-mono">
          </div>

          <div>
            <label for="message" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">お問い合わせ内容 <span class="text-cyan-400">*</span></label>
            <textarea id="message" name="message" rows="4" required placeholder="ご相談内容を入力してください。"
              class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 placeholder-slate-500 text-sm focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition leading-relaxed"></textarea>
          </div>

          <button type="submit" id="teaser-submit-btn"
            class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2.5 rounded-lg text-sm tracking-wide transition duration-200 shadow-lg shadow-cyan-900/20">
            送信する
          </button>
          <p id="teaser-form-status" class="mt-3 text-center text-xs hidden"></p>
        </form>
      </div>

      <script>
        document.getElementById('teaser-contact-form').addEventListener('submit', async function (e) {
          e.preventDefault();
          const GAS_URL = 'ステップ2で取得したGASウェブアプリURL';

          const form = e.target;
          const submitBtn = document.getElementById('teaser-submit-btn');
          const statusEl = document.getElementById('teaser-form-status');

          const payload = {
            name: form.name.value,
            email: form.email.value,
            subject: 'ティザーサイトからのお問い合わせ',
            message: form.message.value,
            hp_field: form.hp_field.value
          };

          submitBtn.disabled = true;
          submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
          submitBtn.textContent = '送信中...';
          statusEl.className = 'mt-3 text-center text-xs text-slate-400 block';
          statusEl.textContent = 'お問い合わせを送信しています...';

          try {
            const res = await fetch(GAS_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.status === 'success') {
              statusEl.className = 'mt-3 text-center text-xs text-emerald-400 block';
              statusEl.textContent = 'お問い合わせを受け付けました。ご連絡ありがとうございます。';
              form.reset();
            } else {
              throw new Error();
            }
          } catch (err) {
            statusEl.className = 'mt-3 text-center text-xs text-rose-400 block';
            statusEl.textContent = '送信中にエラーが発生しました。時間をおいて再度お試しください。';
          } finally {
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            submitBtn.textContent = '送信する';
          }
        });
      </script>

    </div>
  </main>

  <!-- フッター -->
  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>&copy; 2026-2027 I-BO OFFICE. All rights reserved.</p>
  </footer>

</body>
</html>
